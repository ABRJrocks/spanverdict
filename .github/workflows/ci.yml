name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.10', '3.12', '3.13']
        include:
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - run: python -m venv /tmp/spanverdict-wheel
      - run: /tmp/spanverdict-wheel/bin/python -m pip install dist/*.whl
      - run: /tmp/spanverdict-wheel/bin/python -m unittest discover -s tests -v
      - run: /tmp/spanverdict-wheel/bin/spanverdict --version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distribution
          path: dist/
  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install . -r requirements-integration.txt
      - run: python -m unittest discover -s tests_integration -v
  action:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Accept reviewed recorded execution
        uses: ./
        with:
          policy: examples/refund-policy.json
          traces: examples/good.jsonl
          baseline: examples/approved-baseline.json
          report-prefix: reports/good
      - name: Reject broken execution through the Action
        id: broken
        continue-on-error: true
        uses: ./
        with:
          policy: examples/refund-policy.json
          traces: examples/broken.jsonl
          baseline: examples/approved-baseline.json
          report-prefix: reports/broken
      - name: Verify rejection is a real contract failure
        env:
          BROKEN_OUTCOME: ${{ steps.broken.outcome }}
        run: |
          python - <<'PY'
          import json, os
          assert os.environ['BROKEN_OUTCOME'] == 'failure'
          with open('reports/broken.json') as file:
              report = json.load(file)
          assert report['passed'] is False
          assert report['summary'] == {'cases':3,'runs':9,'failures':17}
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: execution-reports
          path: reports/
