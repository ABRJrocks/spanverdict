[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spanverdict"
version = "0.1.0"
description = "Deterministic CI contracts and regression checks for OpenTelemetry agent traces"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Abdul Rafay"}]
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Topic :: Software Development :: Testing"]

[project.urls]
Repository = "https://github.com/ABRJrocks/spanverdict"
Issues = "https://github.com/ABRJrocks/spanverdict/issues"

[project.scripts]
spanverdict = "spanverdict.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
